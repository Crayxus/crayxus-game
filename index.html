<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="AI掼蛋 - 测一测你的掼蛋水平，纯前端AI对战">
    <title>AI掼蛋</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>">
    <link rel="stylesheet" href="css/style.css">

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>
    <!-- QR Code generator (real, scannable) -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
</head>
<body>

<!-- ===== SPLASH SCREEN ===== -->
<div id="splash-screen">
    <div class="bokeh-particle"></div>
    <div class="bokeh-particle"></div>
    <div class="bokeh-particle"></div>
    <div class="bokeh-particle"></div>

    <div class="splash-icon">🃏</div>
    <div class="splash-logo">GUANDAN</div>
    <div class="splash-subtitle">AI SKILL RATING</div>

    <button id="btn-start" class="splash-btn">START</button>
    <div class="splash-loading">
        <div class="loading-top">
            <span class="loading-text" id="loading-text">Loading AI model...</span>
            <span class="loading-pct" id="loading-pct">0%</span>
        </div>
        <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
    </div>

    <div class="splash-footer" id="splash-tested"></div>
</div>

<!-- ===== GAME SCREEN ===== -->
<div id="game-screen">
    <!-- Top bar -->
    <div class="top-bar">
        <div id="game-info" class="game-info">第 1 局</div>
        <div id="ai-status" class="ai-status ai-loading">AI ···</div>
        <button id="btn-menu" class="top-btn">菜单</button>
    </div>

    <!-- Player zones (avatar circles) -->
    <div id="pz-top" class="p-zone p-top">
        <div class="av team-a">友</div>
    </div>
    <div id="pz-left" class="p-zone p-left">
        <div class="av team-b">左</div>
    </div>
    <div id="pz-right" class="p-zone p-right">
        <div class="av team-b">右</div>
    </div>

    <!-- Output areas (played cards) -->
    <div id="out-top" class="out o-t"></div>
    <div id="out-left" class="out o-l"></div>
    <div id="out-right" class="out o-r"></div>
    <div id="out-me" class="out o-m"></div>

    <!-- Hand area -->
    <div id="hand"></div>

    <!-- Floating controls -->
    <div id="ctrls" class="ctrls hidden">
        <button id="btn-pass" class="btn b-pass">过牌</button>
        <button id="btn-hint" class="btn b-hint">提示/重选</button>
        <button id="btn-play" class="btn b-play" disabled>出牌</button>
    </div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div id="result-screen">
    <div class="result-scroll">

        <!-- Outcome bar — weakened, just context -->
        <div class="result-outcome-bar">
            <span id="result-title" class="rout-title">胜利</span>
            <span class="rout-sep">·</span>
            <span id="result-subtitle" class="rout-pos">头游</span>
            <span class="rout-sep">·</span>
            <span id="result-elo-change" class="rout-delta">+18 ELO</span>
        </div>

        <!-- MAIN: Skill rating -->
        <div class="result-skill-main">
            <div class="result-tier-icon" id="result-tier-icon">🏅</div>
            <div class="result-skill-index-label">掼蛋实力指数</div>
            <div class="result-skill-index" id="result-skill-index">1,538</div>
            <div class="result-stars" id="result-stars"></div>
            <div class="result-skill-level" id="result-skill-level">实力等级 · 黄金三星</div>
            <div class="result-legend-rank" id="result-legend-rank" style="display:none">
                传说 #<span id="result-legend-num">999</span>
            </div>
            <div class="result-elo-lock" id="result-elo-lock" style="display:none">
                再完成 <span id="result-lock-remain">2</span> 场或获得头游解锁
            </div>
        </div>

        <!-- Rankings -->
        <div class="result-rank-grid" id="result-rank-grid">
            <div class="result-rank-item">
                <div class="result-rank-val" id="rank-national">—</div>
                <div class="result-rank-lbl">全国</div>
            </div>
            <div class="result-rank-item">
                <div class="result-rank-val" id="rank-province">—</div>
                <div class="result-rank-lbl">全省</div>
            </div>
            <div class="result-rank-item">
                <div class="result-rank-val" id="rank-city">—</div>
                <div class="result-rank-lbl">全市</div>
            </div>
        </div>

        <!-- QR section -->
        <div class="result-qr-section">
            <div class="result-qr-box" id="result-qr-box"></div>
            <div class="result-qr-label">扫码挑战 AI 掼蛋</div>
            <div class="result-qr-url">aiguandan.au</div>
        </div>

        <!-- Buttons -->
        <div class="result-buttons">
            <button id="btn-again" class="result-btn btn-again">PLAY AGAIN</button>
        </div>
    </div>
</div>

<!-- ===== SHARE MODAL ===== -->
<div id="share-modal">
    <div class="share-card-container" id="share-card-area"></div>
    <div class="share-buttons">
        <button id="share-save-btn" class="share-btn share-save">保存图片</button>
        <button id="share-share-btn" class="share-btn share-save" style="background:linear-gradient(135deg,#2196f3,#1565c0);color:white">分享</button>
        <button id="share-close-btn" class="share-btn share-close">关闭</button>
    </div>
</div>

<!-- ===== REGION MODAL ===== -->
<div id="region-modal">
    <div class="region-content">
        <div class="region-title">选择地区</div>
        <select id="region-province" class="region-select">
            <option value="">选择省份</option>
            <option value="全国">全国</option>
            <option value="北京">北京</option><option value="上海">上海</option>
            <option value="天津">天津</option><option value="重庆">重庆</option>
            <option value="江苏">江苏</option><option value="浙江">浙江</option>
            <option value="安徽">安徽</option><option value="福建">福建</option>
            <option value="广东">广东</option><option value="山东">山东</option>
            <option value="河南">河南</option><option value="湖北">湖北</option>
            <option value="湖南">湖南</option><option value="四川">四川</option>
            <option value="河北">河北</option><option value="山西">山西</option>
            <option value="辽宁">辽宁</option><option value="吉林">吉林</option>
            <option value="黑龙江">黑龙江</option><option value="江西">江西</option>
            <option value="陕西">陕西</option><option value="云南">云南</option>
            <option value="贵州">贵州</option><option value="甘肃">甘肃</option>
            <option value="海南">海南</option><option value="广西">广西</option>
            <option value="内蒙古">内蒙古</option><option value="西藏">西藏</option>
            <option value="宁夏">宁夏</option><option value="新疆">新疆</option>
            <option value="青海">青海</option>
        </select>
        <button id="region-confirm-btn" class="region-confirm">确认</button>
    </div>
</div>

<!-- Toast -->
<div id="toast" style="opacity:0"></div>

<script>window.G={};</script>
<script src="js/card.js"></script>
<script src="js/hand-detector.js"></script>
<script src="js/hand-comparator.js"></script>
<script src="js/move-generator.js"></script>
<script src="js/game-engine.js"></script>
<script src="js/state-encoder.js"></script>
<script src="js/move-encoder.js"></script>
<script src="js/history-encoder.js"></script>
<script src="js/ai-agent.js"></script>
<script src="js/card-svg.js"></script>
<script src="js/ui-renderer.js"></script>
<script src="js/scoring.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>

<!-- Register Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
    });
}
</script>

</body>
</html>
