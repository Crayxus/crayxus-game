<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI·GP 决策流程图 — 第一个学生 → 中天研发 → 白名单</title>
<meta property="og:image" content="https://crayxus-game.onrender.com/aigp-course/share.jpg">
<meta property="og:title" content="AI·GP 决策流程图 · 主线:学生→中天研发→白名单">
<meta property="og:description" content="方块·菱形·YES/NO·概率——主线一条,警示一条,一张图看完。">
<style>
  :root{
    --bg0:#070318; --bg1:#140a35; --bg2:#1d0d4a;
    --pink:#ff2e9a; --cyan:#19e3ff; --purple:#8b3bff; --gold:#ffcf5c; --green:#3ce29a; --red:#ff5d73;
    --ink:#eef0ff; --dim:#a9a3cf; --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);line-height:1.6;
    background:
      radial-gradient(1200px 600px at 12% -5%, rgba(139,59,255,.34), transparent 60%),
      radial-gradient(900px 500px at 96% 4%, rgba(255,46,154,.2), transparent 55%),
      radial-gradient(800px 700px at 80% 100%, rgba(25,227,255,.14), transparent 55%),
      linear-gradient(160deg, var(--bg0), var(--bg1) 55%, var(--bg2));
    background-attachment:fixed;padding:0 0 70px}
  .wrap{max-width:1060px;margin:0 auto;padding:0 18px}
  .neon{background:linear-gradient(92deg,var(--cyan),var(--pink) 60%,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
  header{padding:46px 0 8px;text-align:center}
  .kicker{letter-spacing:.4em;font-size:12px;color:var(--cyan);font-weight:800}
  h1{font-size:32px;line-height:1.25;margin:12px 0 6px;font-weight:900}
  .sub{color:var(--dim);font-size:14px;max-width:720px;margin:6px auto 0}
  .sub b{color:#fff}
  .legend{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 6px}
  .lg{font-size:12px;color:var(--dim);padding:5px 12px;border-radius:20px;background:var(--glass);border:1px solid var(--line)}
  .lg b{color:#fff}
  .chart{margin-top:10px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.02);padding:6px}
  svg{width:100%;height:auto;display:block;font-family:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  svg .box{fill:rgba(255,255,255,.05);stroke:rgba(25,227,255,.55);stroke-width:1.6}
  svg .boxL{fill:rgba(255,93,115,.07);stroke:rgba(255,93,115,.6);stroke-width:1.6}
  svg .boxR{fill:rgba(60,226,154,.07);stroke:rgba(60,226,154,.6);stroke-width:1.6}
  svg .boxF{fill:rgba(25,227,255,.05);stroke:rgba(25,227,255,.5);stroke-width:1.6;stroke-dasharray:7 6}
  svg .dia{fill:rgba(139,59,255,.12);stroke:#8b3bff;stroke-width:1.8}
  svg .diaR{fill:rgba(60,226,154,.1);stroke:rgba(60,226,154,.75);stroke-width:1.8}
  svg .term{fill:rgba(255,207,92,.12);stroke:var(--gold);stroke-width:2}
  svg .termR{fill:rgba(255,93,115,.13);stroke:var(--red);stroke-width:2}
  svg .termG{fill:rgba(169,163,207,.1);stroke:#a9a3cf;stroke-width:1.6}
  svg .start{fill:rgba(255,207,92,.14);stroke:var(--gold);stroke-width:2}
  svg .ln{stroke:rgba(238,240,255,.55);stroke-width:2.4;fill:none}
  svg .lnL{stroke:rgba(255,93,115,.8);stroke-width:2.4;fill:none}
  svg .lnR{stroke:rgba(60,226,154,.85);stroke-width:2.8;fill:none}
  svg .lnY{stroke:rgba(255,207,92,.85);stroke-width:2.2;fill:none;stroke-dasharray:8 6}
  svg .t{fill:#eef0ff;font-size:15.5px;font-weight:800;text-anchor:middle}
  svg .d{fill:#a9a3cf;font-size:12.5px;text-anchor:middle}
  svg .lab{font-size:13px;font-weight:900}
  svg .labG{fill:#3ce29a} svg .labR{fill:#ff5d73} svg .labY{fill:#ffcf5c} svg .labD{fill:#a9a3cf}
  svg .prob{font-size:13.5px;font-weight:900;text-anchor:middle}
  .final{margin-top:24px;padding:22px;border-radius:18px;text-align:center;
    background:linear-gradient(120deg,rgba(25,227,255,.1),rgba(255,46,154,.12));border:1px solid rgba(255,46,154,.4)}
  .final h2{font-size:19px;font-weight:900;line-height:1.55}
  .final .gold{background:linear-gradient(92deg,#ffe9b0,var(--gold) 55%,#ff9a4d);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hint{text-align:center;color:var(--dim);font-size:12px;margin-top:10px}
  .foot{text-align:center;margin-top:40px;color:var(--dim);font-size:11.5px;letter-spacing:.18em}
  @media(max-width:700px){h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">AI·GP DECISION FLOWCHART</div>
    <h1>主线:<span class="neon">第一个学生 → 中天研发 → 白名单</span></h1>
    <p class="sub">主线只有一条:<b>第一个学生进来,钱和人全部走向中天研发</b>。其余一切,要么零预算并行,要么等钥匙解锁。</p>
  </header>

  <div class="legend">
    <span class="lg">🟡 <b>胶囊</b> = 起点 / 终局</span>
    <span class="lg">▭ <b>方块</b> = 动作</span>
    <span class="lg">◇ <b>菱形</b> = YES / NO 判断</span>
    <span class="lg">🟢 <b>绿粗线</b> = 主线</span>
    <span class="lg">🔴 <b>红线</b> = 警示支线</span>
    <span class="lg">┄ <b>虚线框</b> = 零预算并行</span>
  </div>

  <div class="chart">
  <svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eef0ff" opacity=".75"/></marker>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5d73"/></marker>
      <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ce29a"/></marker>
      <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffcf5c"/></marker>
    </defs>

    <!-- START -->
    <rect class="start" x="320" y="18" width="360" height="58" rx="29"/>
    <text class="t" x="500" y="43">🎓 START · 第一个学生签约入学</text>
    <text class="d" x="500" y="62">学费 ¥100,000 + 车款 ¥9,800</text>
    <line class="lnR" x1="500" y1="76" x2="500" y2="104" marker-end="url(#ag)"/>

    <!-- D0 资金纪律 -->
    <polygon class="dia" points="500,106 648,166 500,226 352,166"/>
    <text class="t" x="500" y="161">资金纪律</text>
    <text class="d" x="500" y="182">钱 100% 跟研发主线走?</text>

    <!-- NO → 左警示支线 -->
    <polyline class="lnL" points="352,166 180,166 180,250" marker-end="url(#ar)"/>
    <text class="lab labR" x="206" y="152">NO · 摊开花</text>
    <rect class="boxL" x="40" y="252" width="280" height="72" rx="12"/>
    <text class="t" x="180" y="280">样板间 · 营 · 进校 · 研发</text>
    <text class="d" x="180" y="300">每线只分到 2–3 万</text>
    <text class="d" x="180" y="316">全都走不到终点,还欠着 T2–T4 的课</text>
    <line class="lnL" x1="180" y1="324" x2="180" y2="358" marker-end="url(#ar)"/>
    <rect class="termR" x="40" y="360" width="280" height="60" rx="30"/>
    <text class="t" x="180" y="385">❌ 无战绩 · 交付违约</text>
    <text class="d" x="180" y="404">口碑反噬 · 模式死亡</text>
    <text class="prob" x="180" y="448" fill="#ff5d73">路径成功概率 ≈ 5%</text>

    <!-- YES → 主线 -->
    <line class="lnR" x1="500" y1="226" x2="500" y2="260" marker-end="url(#ag)"/>
    <text class="lab labG" x="516" y="250">YES · 主线</text>

    <rect class="boxR" x="350" y="262" width="300" height="72" rx="12"/>
    <text class="t" x="500" y="289">资金分配 · 账面闭环</text>
    <text class="d" x="500" y="309">研发物料 4.7万 + 运营 3万 + 机动 2万</text>
    <text class="d" x="500" y="326">刚好 = "跑赢人类"的全部弹药</text>
    <line class="lnR" x1="500" y1="334" x2="500" y2="368" marker-end="url(#ag)"/>

    <rect class="boxR" x="350" y="370" width="300" height="98" rx="12"/>
    <text class="t" x="500" y="398">🔧 中天研发主线(M1–M8)</text>
    <text class="d" x="500" y="418">中天场地 + 中天同款车上跑通:</text>
    <text class="d" x="500" y="435">T1 让车动 → T2 训模型·计时 → T3 圈速逼近</text>
    <text class="d" x="500" y="452">学生全程亲手参与 = 课程与研发同一件事</text>
    <text class="d" x="500" y="464" style="font-size:11.5px;fill:#3ce29a">每月圈速曲线 = 给中天的进度汇报</text>
    <line class="lnR" x1="500" y1="468" x2="500" y2="502" marker-end="url(#ag)"/>

    <rect class="boxF" x="350" y="504" width="300" height="68" rx="12"/>
    <text class="t" x="500" y="530" style="font-size:14px">🆓 零预算占位 · 三线并行不花钱</text>
    <text class="d" x="500" y="550">进校 demo 顺路做 · 赛车营只预售</text>
    <text class="d" x="500" y="566">商场只谈点位不付租</text>
    <line class="lnR" x1="500" y1="572" x2="500" y2="610" marker-end="url(#ag)"/>

    <!-- D1 M9 决战 -->
    <polygon class="diaR" points="500,612 644,672 500,732 356,672"/>
    <text class="t" x="500" y="667">M9 决战</text>
    <text class="d" x="500" y="687">单圈跑赢人类?</text>

    <!-- YES 主线继续 -->
    <text class="lab labG" x="516" y="756">YES · 70–80%</text>
    <line class="lnR" x1="500" y1="732" x2="500" y2="766" marker-end="url(#ag)"/>

    <rect class="boxR" x="350" y="768" width="300" height="58" rx="12"/>
    <text class="t" x="500" y="792">⚡ 决定性证据</text>
    <text class="d" x="500" y="812">战绩 + 全程影像 = 一份证据 · 四处变现</text>
    <line class="lnR" x1="500" y1="826" x2="500" y2="858" marker-end="url(#ag)"/>

    <rect class="boxR" x="350" y="860" width="300" height="56" rx="12"/>
    <text class="t" x="500" y="883">🏆 白名单申报 × 中天联合立项</text>
    <text class="d" x="500" y="903">身位跃迁:从机构 → 赛事规则制定方</text>
    <line class="lnR" x1="500" y1="916" x2="500" y2="948" marker-end="url(#ag)"/>

    <rect class="boxR" x="350" y="950" width="300" height="74" rx="12"/>
    <text class="t" x="500" y="976">🔓 三线自动解锁</text>
    <text class="d" x="500" y="996">进校=通行证 · 赛车营=招生引爆</text>
    <text class="d" x="500" y="1013">样板间=有战绩内容可放</text>
    <line class="lnR" x1="500" y1="1024" x2="500" y2="1056" marker-end="url(#ag)"/>

    <rect class="term" x="340" y="1058" width="320" height="60" rx="30"/>
    <text class="t" x="500" y="1083">🏁 Y2:第二期现金流 · 规模化</text>
    <text class="d" x="500" y="1103">营开营(已预售) · 学校签约 · 样板间落地</text>
    <text class="prob" x="500" y="1148" fill="#ffcf5c">主线成功概率:高(70%+)</text>

    <!-- NO 支线(右) -->
    <polyline class="lnL" points="644,672 800,672 800,766" marker-end="url(#ar)"/>
    <text class="lab labR" x="676" y="658">NO · 20–30%</text>
    <rect class="box" x="670" y="768" width="260" height="74" rx="12"/>
    <text class="t" x="800" y="794" style="font-size:14.5px">完整课程已交付</text>
    <text class="d" x="800" y="814">+ 圈速曲线 + 研究成果</text>
    <text class="d" x="800" y="831">信用保留,不归零</text>
    <line class="ln" x1="800" y1="842" x2="800" y2="874" marker-end="url(#aw)"/>

    <polygon class="dia" points="800,876 916,926 800,976 684,926"/>
    <text class="t" x="800" y="921" style="font-size:14.5px">差距 &lt; 5%?</text>
    <text class="d" x="800" y="941">(从轨迹数据看卡点)</text>

    <polyline class="lnY" points="684,926 640,926 640,696 644,690" marker-end="url(#ay)"/>
    <text class="lab labY" x="632" y="816" text-anchor="end">YES · 加练再战 ↺</text>

    <text class="lab labD" x="816" y="996">NO</text>
    <line class="ln" x1="800" y1="976" x2="800" y2="1008" marker-end="url(#aw)"/>
    <rect class="termG" x="680" y="1010" width="240" height="56" rx="28"/>
    <text class="t" x="800" y="1034" style="font-size:14.5px">转型纯课程产品</text>
    <text class="d" x="800" y="1053">体面收场 · 客户拿到完整价值</text>
  </svg>
  </div>
  <p class="hint">手机查看:双指缩放,或横屏</p>

  <div class="final">
    <h2>主线一条:学生进来 → 中天研发 → 跑赢人类 → 白名单。<br><span class="gold">课程与研发是同一件事,学费就是研发经费。</span></h2>
  </div>

  <img src="https://crayxus-game.onrender.com/aigp-course/share.jpg" alt="CRAYXUS AI·GP" style="display:block;margin:30px auto 0;width:280px;max-width:78%;border-radius:16px;border:1px solid rgba(255,255,255,.15)">
<div class="foot">CRAYXUS AI·GP　·　DECISION FLOWCHART　·　内部讨论稿</div>

</div>
</body>
</html>
