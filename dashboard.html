<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRAYXUS 48人标准赛 · 大屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e1a;--card:#141926;--accent:#00d4aa;--accent2:#7c4dff;
  --gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --red:#ff4757;--green:#2ed573;--blue:#3742fa;
  --text:#e8e8e8;--dim:#8892a4;--border:#1e2a3a;
  --orange:#ff9500;--magenta:#ff00ff;
}
body{font-family:-apple-system,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow:hidden;user-select:none}

/* === HEADER BAR === */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;background:linear-gradient(135deg,#141926,#1a2332);border-bottom:1px solid var(--border)}
.top-left{display:flex;align-items:center;gap:16px}
.logo{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.event-name{font-size:15px;color:var(--dim);font-weight:600}
.top-center{display:flex;align-items:center;gap:24px}
.round-badge{font-size:28px;font-weight:900;color:var(--accent);letter-spacing:1px}
.round-label{font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:2px}
.phase-tag{font-size:12px;font-weight:700;padding:4px 14px;border-radius:20px;letter-spacing:1px}
.phase-tag.warmup{background:rgba(0,212,170,.15);color:var(--accent)}
.phase-tag.elimination{background:rgba(255,71,87,.15);color:var(--red)}
.phase-tag.finished{background:rgba(255,215,0,.15);color:var(--gold)}
.top-right{display:flex;align-items:center;gap:20px}
.timer{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text);letter-spacing:2px}
.timer.warning{color:var(--orange);animation:timerPulse 1s ease infinite}
.timer.danger{color:var(--red);animation:timerPulse .5s ease infinite}
.alive-count{font-size:14px;color:var(--dim)}
.alive-count span{color:var(--accent);font-weight:800;font-size:18px}

@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}

/* === PLAYER GRID === */
.grid-wrap{padding:20px 28px;height:calc(100vh - 70px);display:flex;flex-direction:column}
.player-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px;flex:1;align-content:start}

/* === PLAYER CIRCLE === */
.player-cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:var(--card);border:3px solid var(--border);transition:all .4s ease;cursor:default;overflow:visible}
.player-cell.empty{opacity:.15;border-style:dashed}

/* Name */
.p-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80%;text-align:center;line-height:1.2;margin-bottom:2px}

/* Score */
.p-score{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--text);line-height:1;transition:color .3s}
.p-score.positive{color:var(--green)}
.p-score.negative{color:var(--red)}

/* Score delta arrow — inside the circle */
.p-delta{position:absolute;top:8px;right:8px;font-size:11px;font-weight:800;opacity:0;transition:opacity .3s;pointer-events:none;display:flex;align-items:center;gap:2px;border-radius:10px;padding:2px 6px}
.p-delta.up{color:#000;background:var(--green);opacity:1;animation:deltaFadeUp 2.5s ease forwards}
.p-delta.down{color:#fff;background:var(--red);opacity:1;animation:deltaFadeDown 2.5s ease forwards}

@keyframes deltaFadeUp{
  0%{opacity:0;transform:translateY(6px)}
  15%{opacity:1;transform:translateY(0)}
  70%{opacity:1}
  100%{opacity:0;transform:translateY(-8px)}
}
@keyframes deltaFadeDown{
  0%{opacity:0;transform:translateY(-6px)}
  15%{opacity:1;transform:translateY(0)}
  70%{opacity:1}
  100%{opacity:0;transform:translateY(8px)}
}

/* MMR tier dot */
.p-tier{font-size:10px;font-weight:700;margin-top:2px;letter-spacing:1px;opacity:.7}
.p-tier.t-entry{color:#888}
.p-tier.t-advance{color:var(--blue)}
.p-tier.t-elite{color:var(--green)}
.p-tier.t-master{color:var(--gold)}
.p-tier.t-grandmaster{color:var(--accent2)}
.p-tier.t-king{color:var(--red)}

/* Rank badge */
.p-rank{position:absolute;top:-4px;left:-4px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:#000;z-index:2}
.p-rank.r1{background:var(--gold)}
.p-rank.r2{background:var(--silver)}
.p-rank.r3{background:var(--bronze)}
.p-rank.rn{background:var(--border);color:var(--dim);font-size:10px}

/* Score UP glow */
.player-cell.glow-up{border-color:var(--green);box-shadow:0 0 20px rgba(46,213,115,.4),inset 0 0 15px rgba(46,213,115,.1);animation:glowUpPulse 2s ease forwards}
@keyframes glowUpPulse{
  0%{box-shadow:0 0 20px rgba(46,213,115,.6),inset 0 0 15px rgba(46,213,115,.15)}
  100%{box-shadow:none;border-color:var(--border)}
}

/* Score DOWN glow */
.player-cell.glow-down{border-color:var(--red);box-shadow:0 0 20px rgba(255,71,87,.4),inset 0 0 15px rgba(255,71,87,.1);animation:glowDownPulse 2s ease forwards}
@keyframes glowDownPulse{
  0%{box-shadow:0 0 20px rgba(255,71,87,.6),inset 0 0 15px rgba(255,71,87,.15)}
  100%{box-shadow:none;border-color:var(--border)}
}

/* === ELIMINATED STATE === */
.player-cell.eliminated{opacity:.25;border-color:rgba(255,71,87,.3);animation:none !important;box-shadow:none !important}
.player-cell.eliminated .p-name,.player-cell.eliminated .p-score,.player-cell.eliminated .p-tier{opacity:.3}
.elim-overlay{display:none;position:absolute;inset:0;border-radius:50%;background:rgba(255,71,87,.12);z-index:5;align-items:center;justify-content:center}
.player-cell.eliminated .elim-overlay{display:flex}
.elim-x{font-size:36px;font-weight:900;color:var(--red);opacity:.7;letter-spacing:4px;text-shadow:0 0 10px rgba(255,71,87,.5)}

/* Elimination entrance animation */
.player-cell.elim-anim{animation:elimShake .6s ease}
@keyframes elimShake{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.08)}
  40%{transform:scale(.92) rotate(-3deg)}
  60%{transform:scale(1.04) rotate(2deg)}
  80%{transform:scale(.98)}
}

/* === BOTTOM INFO BAR === */
.bottom-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 32px;background:rgba(20,25,38,.8);border-top:1px solid var(--border);font-size:12px;color:var(--dim)}
.bottom-bar .tables-info{display:flex;gap:16px}
.table-chip{padding:3px 10px;border-radius:8px;background:rgba(255,255,255,.04);font-size:11px;font-weight:600}
.table-chip.active{background:rgba(0,212,170,.1);color:var(--accent)}
.elim-next{color:var(--red);font-weight:700}

/* === RESPONSIVE === */
@media(max-width:1200px){
  .player-grid{grid-template-columns:repeat(6,1fr);gap:10px}
}
@media(max-width:900px){
  .player-grid{grid-template-columns:repeat(4,1fr);gap:8px}
  .p-score{font-size:18px}
  .p-name{font-size:11px}
}

/* === SETUP OVERLAY === */
.setup-overlay{position:fixed;inset:0;background:rgba(10,14,26,.95);z-index:100;display:flex;align-items:center;justify-content:center}
.setup-overlay.hidden{display:none}
.setup-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:40px;width:420px;max-width:90vw;text-align:center}
.setup-box h2{font-size:22px;margin-bottom:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.setup-box p{color:var(--dim);font-size:14px;margin-bottom:24px}
.setup-input{width:100%;padding:14px 20px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:16px;text-align:center;letter-spacing:4px;font-weight:800;margin-bottom:16px;outline:none}
.setup-input:focus{border-color:var(--accent)}
.setup-input::placeholder{letter-spacing:1px;font-weight:400;color:var(--dim)}
.setup-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.setup-btn:hover{opacity:.9}
.setup-btn:disabled{opacity:.4;cursor:not-allowed}
.setup-err{color:var(--red);font-size:13px;margin-top:10px;min-height:20px}

/* Demo button */
.demo-link{color:var(--dim);font-size:13px;margin-top:16px;cursor:pointer;display:inline-block}
.demo-link:hover{color:var(--accent)}

/* Referee entry */
.ref-link{color:var(--accent2);font-size:13px;margin-top:8px;cursor:pointer;display:inline-block;font-weight:600}
.ref-link:hover{color:var(--magenta)}
.ref-row{display:none;margin-top:12px;gap:8px;align-items:center}
.ref-row.show{display:flex}
.ref-pin{flex:1;padding:12px 16px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;text-align:center;letter-spacing:3px;font-weight:700;outline:none}
.ref-pin:focus{border-color:var(--accent2)}
.ref-btn{padding:12px 20px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--accent2),var(--magenta));color:#fff;font-size:14px;font-weight:700;cursor:pointer}

/* === REFEREE PANEL (bottom-right floating) === */
.ref-panel{display:none;position:fixed;bottom:50px;right:20px;width:340px;max-height:70vh;background:var(--card);border:1px solid var(--accent2);border-radius:16px;z-index:80;overflow:hidden;box-shadow:0 8px 40px rgba(124,77,255,.2)}
.ref-panel.open{display:flex;flex-direction:column}
.ref-panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(124,77,255,.1);border-bottom:1px solid var(--border)}
.ref-panel-header h3{font-size:14px;color:var(--accent2);font-weight:800}
.ref-close{background:none;border:none;color:var(--dim);font-size:18px;cursor:pointer}
.ref-close:hover{color:var(--red)}
.ref-panel-body{flex:1;overflow-y:auto;padding:12px 16px}
.ref-section{margin-bottom:16px}
.ref-section h4{font-size:12px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.ref-action-btn{width:100%;padding:10px;border:none;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;transition:opacity .2s}
.ref-action-btn:hover{opacity:.85}
.ref-action-btn.green{background:var(--green);color:#000}
.ref-action-btn.red{background:var(--red);color:#fff}
.ref-action-btn.blue{background:var(--accent);color:#000}
.ref-action-btn.purple{background:var(--accent2);color:#fff}
.ref-action-btn:disabled{opacity:.3;cursor:not-allowed}
.ref-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ref-select{width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none;margin-bottom:6px}
.ref-msg{font-size:12px;color:var(--accent);margin-top:6px;min-height:16px}

/* Referee badge in top bar */
.ref-badge{display:none;padding:4px 12px;border-radius:12px;background:rgba(124,77,255,.15);color:var(--accent2);font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(124,77,255,.3)}
.ref-badge:hover{background:rgba(124,77,255,.25)}
.ref-badge.active{display:inline-block}
</style>
</head>
<body>

<!-- SETUP: enter tournament code -->
<div class="setup-overlay" id="setup">
  <div class="setup-box">
    <h2>CRAYXUS 大屏</h2>
    <p>输入赛事代码连接大屏</p>
    <input class="setup-input" id="codeInput" placeholder="赛事代码" maxlength="8" autocomplete="off">
    <button class="setup-btn" id="connectBtn" onclick="connectTournament()">观众入口</button>
    <div class="ref-link" onclick="toggleRefRow()">Enter as Referee</div>
    <div class="ref-row" id="refRow">
      <input class="ref-pin" id="refPinInput" placeholder="裁判PIN" maxlength="6" type="password">
      <button class="ref-btn" onclick="connectAsReferee()">验证</button>
    </div>
    <div class="setup-err" id="setupErr"></div>
    <div class="demo-link" onclick="startDemo()">演示模式（无需赛事）</div>
  </div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-left">
    <div class="logo">CRAYXUS</div>
    <div class="event-name" id="eventName">48人标准赛</div>
  </div>
  <div class="top-center">
    <div>
      <div class="round-label">ROUND</div>
      <div class="round-badge" id="roundNum">0 / 20</div>
    </div>
    <div class="phase-tag warmup" id="phaseTag">热身期</div>
  </div>
  <div class="top-right">
    <div class="timer" id="timer">05:00</div>
    <div class="alive-count">在场 <span id="aliveCount">48</span> 人</div>
    <div class="ref-badge" id="refBadge" onclick="toggleRefPanel()">REFEREE</div>
  </div>
</div>

<!-- REFEREE CONTROL PANEL -->
<div class="ref-panel" id="refPanel">
  <div class="ref-panel-header">
    <h3>REFEREE CONTROL</h3>
    <button class="ref-close" onclick="toggleRefPanel()">&times;</button>
  </div>
  <div class="ref-panel-body">
    <div class="ref-section">
      <h4>轮次控制</h4>
      <button class="ref-action-btn green" onclick="refNextRound()">开始下一轮</button>
      <button class="ref-action-btn red" id="elimBtn" onclick="refEliminate()">执行淘汰（末4名）</button>
    </div>
    <div class="ref-section">
      <h4>录入本桌结果</h4>
      <select class="ref-select" id="refTable">
        <option value="">选择桌号...</option>
      </select>
      <div class="ref-result-grid">
        <button class="ref-action-btn green" onclick="refReportResult('doubleUp')">双上游 +20</button>
        <button class="ref-action-btn blue" onclick="refReportResult('singleUpWin')">单边上游 +12</button>
        <button class="ref-action-btn purple" onclick="refReportResult('singleUpLose')">单边下游 ±0</button>
        <button class="ref-action-btn red" onclick="refReportResult('doubleDown')">双下游 -8</button>
      </div>
      <button class="ref-action-btn red" style="margin-top:6px" onclick="refReportResult('timeout')">超时 -12</button>
    </div>
    <div class="ref-section">
      <h4>手动调整</h4>
      <select class="ref-select" id="refPlayer">
        <option value="">选择选手...</option>
      </select>
      <div class="ref-result-grid">
        <button class="ref-action-btn green" onclick="refAdjust(5,0)">+5分</button>
        <button class="ref-action-btn red" onclick="refAdjust(-5,0)">-5分</button>
        <button class="ref-action-btn green" onclick="refAdjust(10,0)">+10分</button>
        <button class="ref-action-btn red" onclick="refAdjust(-10,0)">-10分</button>
      </div>
    </div>
    <div class="ref-msg" id="refMsg"></div>
  </div>
</div>

<!-- PLAYER GRID -->
<div class="grid-wrap">
  <div class="player-grid" id="playerGrid"></div>
</div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <div class="tables-info" id="tablesInfo"></div>
  <div class="elim-next" id="elimNext"></div>
  <div id="bottomRight" style="color:var(--dim)">CRAYXUS 掼蛋 AI 一体机</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ============================================================
   CRAYXUS 48-Player Dashboard
   ============================================================ */

let socket = null;
let tournamentCode = null;
let players = [];       // [{id, nickname, score, mmr, eliminated, eliminatedRound, rank}]
let currentRound = 0;
let totalRounds = 20;
let timerInterval = null;
let timerSeconds = 0;
let isDemo = false;
let isReferee = false;
let refereePin = '';
let currentTables = []; // [{team1:[], team2:[], tableNum}]

// MMR tier definitions
const MMR_TIERS = [
  { min: 1350, name: '掼蛋王', cls: 't-king' },
  { min: 1250, name: '宗师',   cls: 't-grandmaster' },
  { min: 1150, name: '大师',   cls: 't-master' },
  { min: 1050, name: '精英',   cls: 't-elite' },
  { min: 900,  name: '进阶',   cls: 't-advance' },
  { min: 0,    name: '入门',   cls: 't-entry' }
];

function getTier(mmr) {
  for (let t of MMR_TIERS) if (mmr >= t.min) return t;
  return MMR_TIERS[MMR_TIERS.length - 1];
}

/* ---- URL param auto-connect ---- */
(function(){
  const p = new URLSearchParams(window.location.search);
  const code = p.get('code');
  if (code) {
    document.getElementById('codeInput').value = code.toUpperCase();
    setTimeout(() => connectTournament(), 300);
  }
})();

/* ---- Connect to tournament ---- */
async function connectTournament() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  if (!code) return;
  document.getElementById('setupErr').textContent = '';
  document.getElementById('connectBtn').disabled = true;

  try {
    const res = await fetch(`/api/tournaments/${code}/dashboard`);
    const data = await res.json();
    if (data.error) { showSetupErr(data.error); return; }

    tournamentCode = code;
    players = data.players;
    currentRound = data.currentRound;
    totalRounds = data.totalRounds || 20;
    document.getElementById('eventName').textContent = data.name || '48人标准赛';

    document.getElementById('setup').classList.add('hidden');
    renderAll();
    connectSocket();
  } catch(e) {
    showSetupErr('连接失败: ' + e.message);
  } finally {
    document.getElementById('connectBtn').disabled = false;
  }
}

function showSetupErr(msg) {
  document.getElementById('setupErr').textContent = msg;
  document.getElementById('connectBtn').disabled = false;
}

/* ---- Socket.io ---- */
function connectSocket() {
  if (!tournamentCode) return;
  socket = io();
  socket.on('connect', () => {
    socket.emit('joinDashboard', tournamentCode);
  });

  socket.on('dashboardState', (data) => {
    players = data.players;
    currentRound = data.currentRound;
    renderAll();
  });

  socket.on('scoreUpdate', (data) => {
    // data: { round, changes: [{nickname, scoreDelta, newScore, mmrDelta, newMmr}] }
    currentRound = data.round;
    for (let c of data.changes) {
      let p = players.find(x => x.nickname === c.nickname);
      if (!p) continue;
      p.prevScore = p.score;
      p.score = c.newScore;
      p.mmr = c.newMmr;
      p.lastDelta = c.scoreDelta;
    }
    recalcRanks();
    renderAll();
    // Animate deltas
    for (let c of data.changes) {
      animateDelta(c.nickname, c.scoreDelta);
    }
  });

  socket.on('elimination', (data) => {
    // data: { round, eliminated: [{nickname, finalScore, finalMmr, finalRank}] }
    for (let e of data.eliminated) {
      let p = players.find(x => x.nickname === e.nickname);
      if (p) {
        p.eliminated = true;
        p.eliminatedRound = data.round;
      }
    }
    recalcRanks();
    renderAll();
    // Animate elimination
    for (let e of data.eliminated) {
      animateElimination(e.nickname);
    }
  });

  socket.on('roundStart', (data) => {
    currentRound = data.round;
    renderHeader();
    if (data.timer) startTimer(data.timer);
  });

  socket.on('timerSync', (data) => {
    timerSeconds = data.seconds;
    renderTimer();
  });
}

/* ---- Rank calculation ---- */
function recalcRanks() {
  let active = players.filter(p => !p.eliminated).sort((a, b) => b.score - a.score);
  active.forEach((p, i) => p.rank = i + 1);
  let elim = players.filter(p => p.eliminated).sort((a, b) => (b.eliminatedRound || 0) - (a.eliminatedRound || 0) || b.score - a.score);
  elim.forEach((p, i) => p.rank = active.length + i + 1);
}

/* ---- Render ---- */
function renderAll() {
  recalcRanks();
  renderHeader();
  renderGrid();
  renderBottom();
}

function renderHeader() {
  document.getElementById('roundNum').textContent = `${currentRound} / ${totalRounds}`;
  let tag = document.getElementById('phaseTag');
  let alive = players.filter(p => !p.eliminated).length;
  document.getElementById('aliveCount').textContent = alive;

  if (currentRound <= 10) {
    tag.className = 'phase-tag warmup';
    tag.textContent = '热身期';
  } else if (alive <= 4) {
    tag.className = 'phase-tag finished';
    tag.textContent = '已结束';
  } else {
    tag.className = 'phase-tag elimination';
    tag.textContent = '淘汰期';
  }

  // Elim next info
  let elimNext = document.getElementById('elimNext');
  if (currentRound >= 10 && alive > 4) {
    let sorted = players.filter(p => !p.eliminated).sort((a, b) => a.score - b.score);
    let dangerZone = sorted.slice(0, 4).map(p => p.nickname).join(', ');
    elimNext.textContent = `淘汰区: ${dangerZone}`;
  } else if (currentRound < 10) {
    elimNext.textContent = `第10局后开始淘汰`;
  } else {
    elimNext.textContent = '';
  }
}

function renderGrid() {
  const grid = document.getElementById('playerGrid');
  // Sort: active by rank, then eliminated by elimination round (most recent first)
  let active = players.filter(p => !p.eliminated).sort((a, b) => a.rank - b.rank);
  let elim = players.filter(p => p.eliminated).sort((a, b) => (b.eliminatedRound || 0) - (a.eliminatedRound || 0));
  let ordered = [...active, ...elim];

  // Pad to 48
  while (ordered.length < 48) ordered.push(null);

  // Only re-render if structure changed, otherwise update in-place
  if (grid.children.length !== ordered.length) {
    grid.innerHTML = '';
    for (let i = 0; i < ordered.length; i++) {
      grid.appendChild(createCell(ordered[i], i));
    }
  } else {
    for (let i = 0; i < ordered.length; i++) {
      updateCell(grid.children[i], ordered[i], i);
    }
  }
}

function createCell(p, idx) {
  let div = document.createElement('div');
  div.className = 'player-cell' + (p ? '' : ' empty') + (p && p.eliminated ? ' eliminated' : '');
  div.id = p ? `cell-${p.nickname}` : `cell-empty-${idx}`;

  if (!p) {
    div.innerHTML = `<span class="p-name" style="opacity:.3">${idx + 1}</span>`;
    return div;
  }

  let tier = getTier(p.mmr || 1000);
  let scoreClass = p.score > 0 ? 'positive' : (p.score < 0 ? 'negative' : '');

  div.innerHTML = `
    ${p.rank <= 3 ? `<div class="p-rank r${p.rank}">${p.rank}</div>` : (p.rank <= 48 && !p.eliminated ? `<div class="p-rank rn">${p.rank}</div>` : '')}
    <div class="p-delta" id="delta-${p.nickname}"></div>
    <div class="p-name">${escHtml(p.nickname)}</div>
    <div class="p-score ${scoreClass}" id="score-${p.nickname}">${p.score >= 0 ? '+' + p.score : p.score}</div>
    <div class="p-tier ${tier.cls}">${tier.name}</div>
    <div class="elim-overlay"><span class="elim-x">XX</span></div>
  `;
  return div;
}

function updateCell(div, p, idx) {
  if (!p) {
    div.className = 'player-cell empty';
    div.id = `cell-empty-${idx}`;
    div.innerHTML = `<span class="p-name" style="opacity:.3">${idx + 1}</span>`;
    return;
  }

  let wasElim = div.classList.contains('eliminated');
  div.className = 'player-cell' + (p.eliminated ? ' eliminated' : '');
  div.id = `cell-${p.nickname}`;

  let tier = getTier(p.mmr || 1000);
  let scoreClass = p.score > 0 ? 'positive' : (p.score < 0 ? 'negative' : '');

  div.innerHTML = `
    ${p.rank <= 3 ? `<div class="p-rank r${p.rank}">${p.rank}</div>` : (p.rank <= 48 && !p.eliminated ? `<div class="p-rank rn">${p.rank}</div>` : '')}
    <div class="p-delta" id="delta-${p.nickname}"></div>
    <div class="p-name">${escHtml(p.nickname)}</div>
    <div class="p-score ${scoreClass}" id="score-${p.nickname}">${p.score >= 0 ? '+' + p.score : p.score}</div>
    <div class="p-tier ${tier.cls}">${tier.name}</div>
    <div class="elim-overlay"><span class="elim-x">XX</span></div>
  `;
}

function renderBottom() {
  let alive = players.filter(p => !p.eliminated).length;
  let tables = Math.floor(alive / 4);
  let info = document.getElementById('tablesInfo');
  info.innerHTML = `<span class="table-chip active">${tables} 桌进行中</span>` +
    `<span class="table-chip">${alive} 人在场</span>` +
    `<span class="table-chip">${players.filter(p => p.eliminated).length} 人已淘汰</span>`;
}

/* ---- Animations ---- */
function animateDelta(nickname, delta) {
  let el = document.getElementById(`delta-${nickname}`);
  if (!el) return;

  // Remove old animation classes
  el.className = 'p-delta';
  el.offsetHeight; // force reflow

  if (delta > 0) {
    el.textContent = `+${delta}`;
    el.classList.add('up');
  } else if (delta < 0) {
    el.textContent = `${delta}`;
    el.classList.add('down');
  }

  // Also glow the cell
  let cell = document.getElementById(`cell-${nickname}`);
  if (cell) {
    cell.classList.remove('glow-up', 'glow-down');
    cell.offsetHeight;
    cell.classList.add(delta > 0 ? 'glow-up' : 'glow-down');
    setTimeout(() => cell.classList.remove('glow-up', 'glow-down'), 2500);
  }
}

function animateElimination(nickname) {
  let cell = document.getElementById(`cell-${nickname}`);
  if (!cell) return;
  cell.classList.add('elim-anim');
  setTimeout(() => cell.classList.remove('elim-anim'), 800);
}

/* ---- Timer ---- */
function startTimer(seconds) {
  timerSeconds = seconds;
  clearInterval(timerInterval);
  renderTimer();
  timerInterval = setInterval(() => {
    timerSeconds--;
    if (timerSeconds < 0) timerSeconds = 0;
    renderTimer();
    if (timerSeconds <= 0) clearInterval(timerInterval);
  }, 1000);
}

function renderTimer() {
  let el = document.getElementById('timer');
  let m = Math.floor(timerSeconds / 60);
  let s = timerSeconds % 60;
  el.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  el.className = 'timer' + (timerSeconds <= 30 ? ' danger' : (timerSeconds <= 60 ? ' warning' : ''));
}

/* ---- Utilities ---- */
function escHtml(s) {
  let d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

/* ============================================================
   DEMO MODE — simulates a 48-player tournament
   ============================================================ */
function startDemo() {
  isDemo = true;
  document.getElementById('setup').classList.add('hidden');

  // Generate 48 fake players
  const surnames = ['张','李','王','刘','陈','杨','赵','黄','周','吴','徐','孙','胡','朱','高','林','何','郭','马','罗','梁','宋','郑','谢','韩','唐','冯','于','董','萧','程','曹','袁','邓','许','傅','沈','曾','彭','吕','苏','卢','蒋','蔡','贾','丁','魏','薛','叶','阎'];
  const names = ['伟','芳','娜','秀英','敏','静','丽','强','磊','军','洋','勇','艳','杰','娟','涛','明','超','秀兰','霞','平','刚','桂英'];

  players = [];
  for (let i = 0; i < 48; i++) {
    let nick = surnames[i % surnames.length] + names[Math.floor(Math.random() * names.length)];
    players.push({
      nickname: nick,
      score: 0,
      mmr: 1000,
      eliminated: false,
      eliminatedRound: null,
      rank: i + 1,
      lastDelta: 0
    });
  }

  currentRound = 0;
  totalRounds = 20;
  document.getElementById('eventName').textContent = '演示赛 · 48人标准赛';
  renderAll();
  startTimer(300);

  // Auto-play simulation
  setTimeout(demoNextRound, 2000);
}

function demoNextRound() {
  if (!isDemo) return;
  currentRound++;
  if (currentRound > 20) {
    let tag = document.getElementById('phaseTag');
    tag.className = 'phase-tag finished';
    tag.textContent = '已结束';
    renderAll();
    return;
  }

  renderHeader();
  startTimer(180);

  // Simulate results after 2s
  setTimeout(() => {
    let active = players.filter(p => !p.eliminated);
    // Pair into tables of 4
    let shuffled = [...active].sort(() => Math.random() - 0.5);
    let tables = [];
    for (let i = 0; i < shuffled.length - 3; i += 4) {
      tables.push(shuffled.slice(i, i + 4));
    }

    // Score results
    const outcomes = [
      { score: 20, mmr: 30 },   // 双上游 winner
      { score: 12, mmr: 15 },   // 单边上游 winner side
      { score: 0, mmr: -15 },   // 单边上游 loser side
      { score: -8, mmr: -30 }   // 双下游
    ];

    let changes = [];
    for (let table of tables) {
      // Random outcome type
      let r = Math.random();
      if (r < 0.3) {
        // 双上游: team1 wins big
        [table[0], table[1]].forEach(p => { p.score += 20; p.mmr += 30; changes.push({ nickname: p.nickname, scoreDelta: 20 }); });
        [table[2], table[3]].forEach(p => { p.score -= 8; p.mmr -= 30; changes.push({ nickname: p.nickname, scoreDelta: -8 }); });
      } else if (r < 0.7) {
        // 单边上游
        table[0].score += 12; table[0].mmr += 15; changes.push({ nickname: table[0].nickname, scoreDelta: 12 });
        table[1].score += 12; table[1].mmr += 15; changes.push({ nickname: table[1].nickname, scoreDelta: 12 });
        table[2].score += 0; table[2].mmr -= 15; changes.push({ nickname: table[2].nickname, scoreDelta: 0 });
        table[3].score += 0; table[3].mmr -= 15; changes.push({ nickname: table[3].nickname, scoreDelta: 0 });
      } else {
        // 对方双上游
        [table[0], table[1]].forEach(p => { p.score -= 8; p.mmr -= 30; changes.push({ nickname: p.nickname, scoreDelta: -8 }); });
        [table[2], table[3]].forEach(p => { p.score += 20; p.mmr += 30; changes.push({ nickname: p.nickname, scoreDelta: 20 }); });
      }
    }

    recalcRanks();
    renderAll();
    // Animate
    for (let c of changes) {
      if (c.scoreDelta !== 0) animateDelta(c.nickname, c.scoreDelta);
    }

    // Elimination after round 10
    if (currentRound >= 10) {
      setTimeout(() => {
        let activeNow = players.filter(p => !p.eliminated).sort((a, b) => a.score - b.score);
        if (activeNow.length > 4) {
          let toElim = activeNow.slice(0, 4);
          for (let p of toElim) {
            p.eliminated = true;
            p.eliminatedRound = currentRound;
          }
          recalcRanks();
          renderAll();
          for (let p of toElim) {
            animateElimination(p.nickname);
          }
        }
        // Next round
        setTimeout(demoNextRound, 3000);
      }, 2000);
    } else {
      setTimeout(demoNextRound, 3000);
    }
  }, 2000);
}

/* ============================================================
   REFEREE SYSTEM
   ============================================================ */

function toggleRefRow() {
  document.getElementById('refRow').classList.toggle('show');
}

async function connectAsReferee() {
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const pin = document.getElementById('refPinInput').value.trim();
  if (!code || !pin) { showSetupErr('请输入赛事代码和裁判PIN'); return; }

  try {
    const res = await fetch(`/api/tournaments/${code}/referee-auth`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin })
    });
    const data = await res.json();
    if (data.error) { showSetupErr(data.error); return; }

    isReferee = true;
    refereePin = pin;

    // Now connect normally
    const dRes = await fetch(`/api/tournaments/${code}/dashboard`);
    const dData = await dRes.json();
    if (dData.error) { showSetupErr(dData.error); return; }

    tournamentCode = code;
    players = dData.players;
    currentRound = dData.currentRound;
    totalRounds = dData.totalRounds || 20;
    document.getElementById('eventName').textContent = dData.name || '48人标准赛';
    document.getElementById('setup').classList.add('hidden');

    // Show referee badge
    document.getElementById('refBadge').classList.add('active');

    renderAll();
    updateRefSelects();
    connectSocket();
  } catch(e) {
    showSetupErr('连接失败: ' + e.message);
  }
}

function toggleRefPanel() {
  if (!isReferee) return;
  document.getElementById('refPanel').classList.toggle('open');
  updateRefSelects();
}

function updateRefSelects() {
  // Update player select
  let ps = document.getElementById('refPlayer');
  let active = players.filter(p => !p.eliminated).sort((a, b) => a.rank - b.rank);
  ps.innerHTML = '<option value="">选择选手...</option>' +
    active.map(p => `<option value="${escHtml(p.nickname)}">#${p.rank} ${escHtml(p.nickname)} (${p.score >= 0 ? '+' : ''}${p.score})</option>`).join('');

  // Update table select
  let ts = document.getElementById('refTable');
  if (currentTables.length > 0) {
    ts.innerHTML = '<option value="">选择桌号...</option>' +
      currentTables.map((t, i) => `<option value="${i}">桌${t.tableNum}: ${t.team1.join('+')} vs ${t.team2.join('+')}</option>`).join('');
  } else {
    ts.innerHTML = '<option value="">无桌局数据（请先开始下一轮）</option>';
  }

  // Enable/disable elimination button
  document.getElementById('elimBtn').disabled = currentRound < 10;
}

function showRefMsg(msg, isErr) {
  let el = document.getElementById('refMsg');
  el.textContent = msg;
  el.style.color = isErr ? 'var(--red)' : 'var(--accent)';
  setTimeout(() => el.textContent = '', 4000);
}

async function refNextRound() {
  try {
    const res = await fetch(`/api/tournaments/${tournamentCode}/next-round48`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: refereePin })
    });
    const data = await res.json();
    if (data.error) { showRefMsg(data.error, true); return; }
    currentRound = data.round;
    currentTables = data.tables || [];
    showRefMsg(`第 ${data.round} 轮已开始，${currentTables.length} 桌`);
    updateRefSelects();
    renderHeader();
    startTimer(300);
  } catch(e) { showRefMsg(e.message, true); }
}

async function refEliminate() {
  if (currentRound < 10) { showRefMsg('第10局后才能淘汰', true); return; }
  if (!confirm('确认淘汰当前积分最低的4名选手？')) return;

  try {
    const res = await fetch(`/api/tournaments/${tournamentCode}/eliminate48`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: refereePin })
    });
    const data = await res.json();
    if (data.error) { showRefMsg(data.error, true); return; }
    showRefMsg(`已淘汰: ${data.eliminated.map(e => e.nickname).join(', ')}`);
    updateRefSelects();
  } catch(e) { showRefMsg(e.message, true); }
}

async function refReportResult(outcome) {
  let tableIdx = document.getElementById('refTable').value;
  if (tableIdx === '') { showRefMsg('请先选择桌号', true); return; }
  let table = currentTables[parseInt(tableIdx)];
  if (!table) { showRefMsg('桌号无效', true); return; }

  // Determine which players get which outcome based on the selected result
  let results = [];
  if (outcome === 'doubleUp') {
    // Team 1 双上游
    table.team1.forEach(n => results.push({ nickname: n, outcome: 'doubleUp' }));
    table.team2.forEach(n => results.push({ nickname: n, outcome: 'doubleDown' }));
  } else if (outcome === 'singleUpWin') {
    // Team 1 单边上游 (赢)
    table.team1.forEach(n => results.push({ nickname: n, outcome: 'singleUpWin' }));
    table.team2.forEach(n => results.push({ nickname: n, outcome: 'singleUpLose' }));
  } else if (outcome === 'singleUpLose') {
    // Team 2 单边上游 (赢) — team1 is the loser side
    table.team1.forEach(n => results.push({ nickname: n, outcome: 'singleUpLose' }));
    table.team2.forEach(n => results.push({ nickname: n, outcome: 'singleUpWin' }));
  } else if (outcome === 'doubleDown') {
    // Team 1 双下游
    table.team1.forEach(n => results.push({ nickname: n, outcome: 'doubleDown' }));
    table.team2.forEach(n => results.push({ nickname: n, outcome: 'doubleUp' }));
  } else if (outcome === 'timeout') {
    // Both teams timeout (edge case)
    table.team1.concat(table.team2).forEach(n => results.push({ nickname: n, outcome: 'timeout' }));
  }

  try {
    const res = await fetch(`/api/tournaments/${tournamentCode}/result48`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: refereePin, results })
    });
    const data = await res.json();
    if (data.error) { showRefMsg(data.error, true); return; }
    showRefMsg(`桌${table.tableNum} 结果已录入`);
  } catch(e) { showRefMsg(e.message, true); }
}

async function refAdjust(scoreDelta, mmrDelta) {
  let nickname = document.getElementById('refPlayer').value;
  if (!nickname) { showRefMsg('请先选择选手', true); return; }

  try {
    const res = await fetch(`/api/tournaments/${tournamentCode}/adjust48`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: refereePin, nickname, scoreDelta, mmrDelta })
    });
    const data = await res.json();
    if (data.error) { showRefMsg(data.error, true); return; }
    showRefMsg(`${nickname} 调整 ${scoreDelta >= 0 ? '+' : ''}${scoreDelta}分`);
    updateRefSelects();
  } catch(e) { showRefMsg(e.message, true); }
}
